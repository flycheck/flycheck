name: Docs

on:
  push:
    branches:
      - master
    paths:
      - '**.yml'
      - 'doc/**'
      - CHANGELOG.md
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-manual:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        # Match the version Read the Docs builds with, so the manual is
        # checked against the Sphinx that actually publishes it
        python-version: '3.13'

    - name: Build the manual
      run: |
        pip install -r doc/requirements.txt
        # -W matches `fail_on_warning' in .readthedocs.yaml, so a broken
        # reference is caught here rather than on the published site
        make -C doc SPHINXOPTS="-n -W --keep-going" html
