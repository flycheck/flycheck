name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        emacs-version:
          - 28.2
          - 29.4
          - 30.2
        experimental: [false]
        include:
          - os: ubuntu-latest
            emacs-version: snapshot
            experimental: true
          - os: macos-latest
            emacs-version: snapshot
            experimental: true
          - os: windows-latest
            emacs-version: snapshot
            experimental: true

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: jcs090218/setup-emacs@54b61ac9c1d7011a54d2b6d66dedbcddf20e2fb9 # master, 2026-08-06
      with:
        version: ${{ matrix.emacs-version }}

    - uses: emacs-eask/setup-eask@5e7d164250e4b5e438fb02a21b57d001a3b189b2 # master, 2026-08-06
      with:
        version: 'snapshot'

    # `make init' installs a few dozen major-mode packages so the specs
    # have modes to run in, which is most of a job's time and does not
    # change between runs
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .eask
        key: eask-${{ matrix.os }}-${{ matrix.emacs-version }}-${{ hashFiles('Eask') }}
        restore-keys: |
          eask-${{ matrix.os }}-${{ matrix.emacs-version }}-

    - name: Run tests (Unix)
      if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
      run: |
        make init
        make check
        make specs

    - name: Run tests (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        make init
        make check
        make compile
        make specs
